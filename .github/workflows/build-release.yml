name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Tesseract
        run: |
          choco install tesseract -y
      
      - name: Install Node dependencies
        run: npm install
      
      - name: Setup bundled components
        run: npm run setup:bundled
      
      - name: Copy Tesseract
        run: npm run copy:tesseract
      
      - name: Build application
        run: npm run build:standalone
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get version from package.json
        id: version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: v$version"
      
      - name: Check if release exists
        id: check_release
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $releases = gh release list --limit 100
          if ($releases -match $version) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $version already exists"
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release $version does not exist"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TerrificOCR-Windows-${{ steps.version.outputs.version }}
          path: dist-v1/*.exe
      
      - name: Create or Update Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: TerrificOCR ${{ steps.version.outputs.version }}
          files: dist-v1/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## 🎉 TerrificOCR ${{ steps.version.outputs.version }}
            
            ### Download
            Download `TerrificOCR-Setup-${{ steps.version.outputs.version }}.exe` below
            
            ### Installation
            1. Download the installer
            2. Run the installer
            3. Launch TerrificOCR
            4. Start processing PDFs!
            
            **No prerequisites needed** - Everything is bundled!
      
      - name: Release Already Exists
        if: steps.check_release.outputs.exists == 'true'
        run: |
          Write-Host "✅ Release ${{ steps.version.outputs.version }} already exists"
          Write-Host "To create a new release, bump the version:"
          Write-Host "  npm run version:patch"
          Write-Host "  git push && git push --tags"
